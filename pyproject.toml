[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "function-for-turtle"
version = "0.1.0"
description = "Helpers for turtle: rect, kv, star, pr_tr, fill_circle, georgin, romashka, rozan"
requires-python = ">=3.8"
authors = [{name = "2bytes"}]

[tool.setuptools.packages.find]
where = ["src"]